# Opcional (deseable). Levanta PostgreSQL y ejecuta el DDL al iniciar.
services:
  postgres:
    image: postgres:16
    container_name: electoral_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electoral_db}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiame}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_ddl_electoral.sql:/docker-entrypoint-initdb.d/01_ddl_electoral.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_user}"]
      interval: 5s
      retries: 10

  # TODO (opcional): servicio del ETL
  # etl:
  #   build: .
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./data:/app/data

volumes:
  pgdata:
